name: iosApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "14.0"
settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  DEVELOPMENT_TEAM: ""
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.adbremote
      INFOPLIST_FILE: iosApp/Info.plist
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
      FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../composeApp/build/bin/iosSimulatorArm64/debugFramework
      OTHER_LDFLAGS: $(inherited) -framework ComposeApp
    dependencies:
      - framework: ../composeApp/build/bin/iosSimulatorArm64/debugFramework/ComposeApp.framework
        embed: true

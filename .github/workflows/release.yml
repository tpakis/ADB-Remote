name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Rename APK with version
        run: |
          VERSION=${{ github.event.inputs.version || github.ref_name }}
          VERSION=${VERSION#v}  # Remove 'v' prefix if present
          mv composeApp/build/outputs/apk/debug/composeApp-debug.apk \
             composeApp/build/outputs/apk/debug/ADB-Remote-${VERSION}.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: composeApp/build/outputs/apk/debug/*.apk

  build-desktop:
    strategy:
      fail-fast: false  # Continue other matrix jobs if one fails
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
            task: packageReleaseDmg
            artifact-path: composeApp/build/compose/binaries/main-release/dmg/*.dmg
          # Note: macOS x64 (Intel) requires paid GitHub runners (macos-*-xlarge)
          # Free runners (macos-14, macos-15) are Apple Silicon only
          - os: ubuntu-latest
            name: linux-x64
            task: packageReleaseDeb
            artifact-path: composeApp/build/compose/binaries/main-release/deb/*.deb
          - os: windows-latest
            name: windows-x64
            task: packageReleaseMsi
            artifact-path: composeApp/build/compose/binaries/main-release/msi/*.msi

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Desktop Package
        run: ./gradlew :composeApp:${{ matrix.task }}

      - name: Build UberJar
        run: ./gradlew :composeApp:packageReleaseUberJarForCurrentOS

      - name: Upload Desktop Package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.artifact-path }}

      - name: Upload UberJar
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.name }}
          path: composeApp/build/compose/jars/*.jar

  build-ios:
    runs-on: macos-latest
    continue-on-error: true  # Don't fail the whole workflow if iOS build fails
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Kotlin Framework for iOS Simulator
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Build iOS App for Simulator
        run: |
          cd iosApp
          # Use any available iPhone simulator with arm64 architecture
          xcodebuild -project iosApp.xcodeproj -scheme iosApp \
            -sdk iphonesimulator \
            -arch arm64 \
            -derivedDataPath build \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create iOS Simulator App Archive
        run: |
          VERSION=${{ github.event.inputs.version || github.ref_name }}
          VERSION=${VERSION#v}
          cd iosApp/build/Build/Products/Debug-iphonesimulator
          zip -r ADB-Remote-iOS-Simulator-${VERSION}.zip iosApp.app

      - name: Upload iOS Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: iosApp/build/Build/Products/Debug-iphonesimulator/*.zip

  create-release:
    needs: [build-android, build-desktop, build-ios]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v')  # Run even if some builds failed
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts || echo "No artifacts found"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.apk
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.msi
            artifacts/**/*.jar
            artifacts/**/*.zip
          generate_release_notes: true
          body: |
            > **Note:** Some platform builds may have failed. Check the workflow run for details.

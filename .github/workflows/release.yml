name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Rename APK with version
        run: |
          VERSION=${{ github.event.inputs.version || github.ref_name }}
          VERSION=${VERSION#v}  # Remove 'v' prefix if present
          mv composeApp/build/outputs/apk/debug/composeApp-debug.apk \
             composeApp/build/outputs/apk/debug/ADB-Remote-${VERSION}.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: composeApp/build/outputs/apk/debug/*.apk

  build-desktop:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
            task: packageReleaseDmg
            artifact-path: composeApp/build/compose/binaries/main-release/dmg/*.dmg
          - os: macos-13
            name: macos-x64
            task: packageReleaseDmg
            artifact-path: composeApp/build/compose/binaries/main-release/dmg/*.dmg
          - os: ubuntu-latest
            name: linux-x64
            task: packageReleaseDeb
            artifact-path: composeApp/build/compose/binaries/main-release/deb/*.deb
          - os: windows-latest
            name: windows-x64
            task: packageReleaseMsi
            artifact-path: composeApp/build/compose/binaries/main-release/msi/*.msi

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Desktop Package
        run: ./gradlew :composeApp:${{ matrix.task }}

      - name: Build UberJar
        run: ./gradlew :composeApp:packageReleaseUberJarForCurrentOS

      - name: Upload Desktop Package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.artifact-path }}

      - name: Upload UberJar
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.name }}
          path: composeApp/build/compose/jars/*.jar

  create-release:
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.apk
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.msi
            artifacts/**/*.jar
          generate_release_notes: true
